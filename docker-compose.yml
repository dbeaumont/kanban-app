services:
  postgres:
    image: postgres:16
    environment:
      TZ: Europe/Paris
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [kanban-net]

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      TZ: Europe/Paris
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Explicitly advertise the public URL to avoid redirects to the internal hostname
      KC_HOSTNAME_URL: http://localhost:8085
      KC_HOSTNAME_ADMIN_URL: http://localhost:8085
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q '\"status\".*\"UP\"' <&3'"]
      interval: 5s
      timeout: 10s
      start_period: 90s
      retries: 50
    networks: [kanban-net]

  bff-service:
    build:
      context: ./backend
      dockerfile: ./bff-service/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      board-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8081
      # Auth endpoint must be reachable by the user's browser; use localhost-mapped port
      OIDC_AUTH_URI: http://localhost:8085/realms/kanban-realm/protocol/openid-connect/auth
      OIDC_TOKEN_URI: http://localhost:8085/realms/kanban-realm/protocol/openid-connect/token
      OIDC_USERINFO_URI: http://localhost:8085/realms/kanban-realm/protocol/openid-connect/userinfo
      OIDC_JWKS_URI: http://localhost:8085/realms/kanban-realm/protocol/openid-connect/certs
      OIDC_CLIENT_ID: kanban-bff
      OIDC_CLIENT_SECRET: bff-secret
      # Business endpoints are accessed by BFF; use docker-mapped hosts & port
      FRONTEND_ORIGIN: http://localhost:8080
      BOARD_SERVICE_URL: http://board-service:8082
      TASK_SERVICE_URL: http://task-service:8083
      USER_SERVICE_URL: http://user-service:8084
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  board-service:
    build:
      context: ./backend
      dockerfile: ./board-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: http://keycloak:8080/realms/kanban-realm
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  task-service:
    build:
      context: ./backend
      dockerfile: ./task-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: http://keycloak:8080/realms/kanban-realm
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: http://keycloak:8080/realms/kanban-realm
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  frontend:
    build: ./frontend
    environment:
      TZ: Europe/Paris
      # Use localhost for browser requests; bff-service is not resolvable from the host.
      API_BASE_URL: http://localhost:8081/api
    ports:
      - "8080:80"
    networks: [kanban-net]
    depends_on:
      bff-service:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    environment:
      TZ: Europe/Paris
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [kanban-net]

  grafana:
    image: grafana/grafana:10.2.3
    environment:
      TZ: Europe/Paris
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [kanban-net]

networks:
  kanban-net:

volumes:
  pgdata:
