services:
  postgres:
    image: postgres:16
    environment:
      TZ: Europe/Paris
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [kanban-net]

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    # Génère un certificat auto-signé pour exposer Keycloak en HTTPS sur localhost-keycloak
    entrypoint: ["/opt/keycloak/entrypoint.sh"]
    environment:
      TZ: Europe/Paris
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: none
      KC_STORAGE: jpa
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8085:8085"
    healthcheck:
      # Vérifie le port HTTP interne sans curl, via /dev/tcp (bash)
      test:
        - CMD-SHELL
        - >
          bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep -q "\"status\".*\"UP\"" <&3'
      interval: 5s
      timeout: 10s
      start_period: 90s
      retries: 50
    networks: [kanban-net]

  bff-service:
    build:
      context: ./backend
      dockerfile: ./bff-service/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      board-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8081
      # Browser redirection vers Keycloak (HTTPS via localhost-keycloak pour Secure cookies)
      OIDC_AUTH_URI: ${KEYCLOAK_EXTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      # Back-channel en HTTP sur le réseau Docker pour éviter de gérer le cert auto-signé côté BFF
      OIDC_TOKEN_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      OIDC_USERINFO_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      OIDC_JWKS_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      OIDC_CLIENT_ID: kanban-bff
      OIDC_CLIENT_SECRET: bff-secret
      # Utilise le front nginx comme callback pour le code, il reverse-proxy vers le BFF
      OIDC_REDIRECT_URI: http://localhost:8080/login/oauth2/code/keycloak
      # Business endpoints are accessed by BFF; use docker-mapped hosts & port
      FRONTEND_ORIGIN: http://localhost:8080
      BOARD_SERVICE_URL: http://board-service:8082
      TASK_SERVICE_URL: http://task-service:8083
      USER_SERVICE_URL: http://user-service:8084
    # BFF reste accessible uniquement depuis le réseau Docker; le frontend reverse proxy les appels
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  board-service:
    build:
      context: ./backend
      dockerfile: ./board-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  task-service:
    build:
      context: ./backend
      dockerfile: ./task-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban
      SPRING_DATASOURCE_USERNAME: kanban
      SPRING_DATASOURCE_PASSWORD: kanban
      OIDC_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL}/realms/${KEYCLOAK_REALM}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [kanban-net]

  prometheus:
    image: prom/prometheus:latest
    environment:
      TZ: Europe/Paris
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [kanban-net]

  grafana:
    image: grafana/grafana:10.2.3
    environment:
      TZ: Europe/Paris
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [kanban-net]

  frontend:
    build: ./frontend
    environment:
      TZ: Europe/Paris
      API_BASE_URL: http://localhost:8081/api
    ports:
      - "8080:80"
    networks: [kanban-net]
    depends_on:
      bff-service:
        condition: service_healthy

networks:
  kanban-net:

volumes:
  pgdata:
  keycloak-data:
