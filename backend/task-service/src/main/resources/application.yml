server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${SPRING_DATASOURCE_USERNAME:kanban}
    password: ${SPRING_DATASOURCE_PASSWORD:kanban}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: task_schema
  flyway:
    schemas: task_schema
    default-schema: task_schema
    create-schemas: true
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8085/realms/kanban-realm}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
