server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kanban}
    username: ${SPRING_DATASOURCE_USERNAME:kanban}
    password: ${SPRING_DATASOURCE_PASSWORD:kanban}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: board_schema
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost-keycloak:8085/realms/kanban-realm}
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: board_schema
    default-schema: board_schema
    create-schemas: true
    # Tests pour Flyway
    fail-on-missing-locations: true
    baseline-on-migrate: true   # pour forcer l’application de la baseline, même si la base n'est pas vide

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
      show-details: always

logging:
  level:
    org.apache.coyote.http11: DEBUG
    org.flywaydb.core.internal.command: DEBUG
    org.flywaydb.core.internal.database: DEBUG
    