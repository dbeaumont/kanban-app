server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        # Avoid clashing with Keycloak's own JSESSIONID cookie on localhost.
        name: BFFSESSIONID
        # Defaults are dev-friendly; override in prod (see BFF_SESSION_* env vars)
        same-site: ${BFF_SESSION_SAMESITE:lax}
        secure: ${BFF_SESSION_SECURE:false}
        # Set only in prod to pin the cookie to the BFF (ex: bff.example.com); leave empty for localhost
        domain: ${BFF_SESSION_DOMAIN:}

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OIDC_CLIENT_ID:kanban-bff}
            client-secret: ${OIDC_CLIENT_SECRET:bff-secret}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            # Force external host to avoid redirecting browsers to the internal container hostname
            redirect-uri: ${OIDC_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:https://localhost-keycloak:8085/realms/kanban-realm}
            user-name-attribute: preferred_username
  main:
    web-application-type: servlet

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:8080}
  services:
    board-url: ${BOARD_SERVICE_URL:http://localhost:8082}
    task-url: ${TASK_SERVICE_URL:http://localhost:8083}
    user-url: ${USER_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    org.springframework.security: DEBUG
